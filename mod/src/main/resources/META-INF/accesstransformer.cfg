# 访问转换器（Access Transformer）
#
# 让指定的包私有成员变成公开。NeoForge 在加载时对本 mod 生效，
# 与我们是否安装 JEI/EMI 无关。

# ---- SmithingRecipe 的三个槽位 ----
#
# 这是 27 条锻造配方被标成 opaque 的真正原因：SmithingRecipe **不覆写**
# getIngredients()，继承的默认实现返回空列表；三个槽位藏在
# SmithingTransformRecipe / SmithingTrimRecipe 的包私有字段里。
# 于是通用接口读不到任何输入，Readability 把「无输入」判为「读不到输入」。
#
# 原版接口里确实没有别的读法：SmithingRecipe 只暴露
# isTemplateIngredient / isBaseIngredient / isAdditionIngredient 三个谓词，
# 拿它们反推只能得到物品集合，会丢掉标签身份（比如 base 是
# #minecraft:trimmable_armor），而标签正是协议要保留的东西。
#
# 这两条类是 Minecraft 自己的，JEI 做的是同一件事（见它的
# META-INF/accesstransformer.cfg）—— 访问转换器不是哪个 mod 的特权。
# 我们锁 1.21.1，没有跨版本漂移的问题；字段名写错会在构建期被
# validateAccessTransformers 拦下，而不是等到游戏启动。
public net.minecraft.world.item.crafting.SmithingTransformRecipe template
public net.minecraft.world.item.crafting.SmithingTransformRecipe base
public net.minecraft.world.item.crafting.SmithingTransformRecipe addition
public net.minecraft.world.item.crafting.SmithingTrimRecipe template
public net.minecraft.world.item.crafting.SmithingTrimRecipe base
public net.minecraft.world.item.crafting.SmithingTrimRecipe addition
