modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
# 署名含中文，所以写在这里而不是 gradle.properties（那个文件是 ISO-8859-1 读的）。
authors = "Luzzi（辛六子）"
# 中文描述写在这里，不放在 gradle.properties。
#
# 原因：Gradle 按 ISO-8859-1 读取 gradle.properties（为保证向后兼容，是既定行为），
# 那里的非 ASCII 字符会被读成乱码，然后原样展开到这里 —— 游戏里就会显示一堆
# "æè¿è¡ä¸ç Minecraft..."。这个模板文件是 UTF-8，配合 build.gradle 里显式设置的
# filteringCharset = 'UTF-8'，中文才能正确保留。
description = '''把运行中的 Minecraft 配方数据通过本地 HTTP 暴露给 AI 客户端，供配方查询与产线规划使用。'''

# 只装在客户端。配方查看器（JEI/EMI）本身就是客户端模组，
# 而配方数据在客户端也是全量的（原版靠它做配方书），所以没必要做成双端模组。
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
# 必须是 [版本,) 区间写法，不能只写版本号。
#
# 只写 "21.1.251" 就丢掉了「或更新」这层意思，而 NeoForge 21.1.x 是持续发版的
# （21.1.251 之后还会有新版），README 也承诺支持 21.1.x。官方 MDK 用的就是
# 这个区间写法。
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
