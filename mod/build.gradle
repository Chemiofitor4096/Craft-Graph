// CraftGraph Bridge Mod —— 构建配置
//
// 结构基本沿用官方 MDK（NeoForgeMDKs/MDK-1.21.1-ModDevGradle），
// 只去掉了数据生成器和发布相关的部分。要用时可以从 MDK 抄回来。

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.21.1 用 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 一并发布 sources jar。协议 DTO（dev.craftgraph.api.Models）是给别人对接契约用的，
// 有源码可读会省很多来回。withSourcesJar() 会自动把它加进 java 组件。
java.withSourcesJar()

repositories {
    // 软依赖的模组在这里取编译期 API。**都是 compileOnly**：
    // 只用来让编译器核对我们的调用是否与真实 API 一致，产物里不包含它们、也不依赖它们。
    // 运行时装了就启用对应适配器，没装就退回通用读取（见 RecipeAdapters 的惰性注册）。

    // Create（加工配方的多产出 / 概率 / 流体 / 耗时只能从它的 API 读，见 CreateAdapter）
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
    }

    // EMI / JEI 以后接视图器时在这里加：
    // EMI（客户端模组，Maven 坐标见 https://modrinth.com/mod/emi）
    // maven { url = 'https://maven.terraformersmc.com/releases/' }
    // JEI
    // maven { url = 'https://maven.blamejared.com/' }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        // 这一句把主源码集注册成 mod 的内容来源。名字必须和 mod_id 一致。
        craftgraph {
            sourceSet sourceSets.main
        }
    }

    // 访问转换器：把 SmithingRecipe 那三个包私有槽位变公开。
    // 不这么做的话 27 条锻造配方读不到输入（见 cfg 文件里的说明）。
    accessTransformers {
        from 'src/main/resources/META-INF/accesstransformer.cfg'
    }
    // 条目写错（字段改名、拼错）时构建期就失败。
    // 不校验的话症状是「启动时崩」或者「又变回 27 条 opaque」——
    // 后者尤其难查，因为它看起来跟「本来就这样」一模一样。
    validateAccessTransformers = true
}

// 把 gradle.properties 里的 mod 元信息注入到 neoforge.mods.toml。
// 这样版本号等信息只有一处定义，不用改两个地方。
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties

    // 显式指定 UTF-8，不依赖 JVM 默认字符集。
    // 模板里有中文（Mod 描述），靠默认值的话哪天有人用 -Dfile.encoding 跑构建就会变乱码，
    // 而且症状是「游戏里描述变乱码」，离原因很远。
    filteringCharset = 'UTF-8'
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// 共享核心（不含 Minecraft 的那一半：算法、协议 DTO、HTTP 服务、快照）。
//
// 用 srcDir 把这批源码**当成主源码集的一部分**编进来，而不是 `implementation project(':core')`
// 再把 class 合并进 jar。理由是这样绕着走了 ModDevGradle：
// 它会自己配置 jar 任务，我加的那句 `jar { from project(':core')... }` 被它静默丢掉了
//（实测：sources jar 里拿到了核心源码，而 jar 里一个核心 class 都没有 ——
//  这种「配了但没生效」正是本项目最警惕的形状，所以换成不依赖它配合的写法）。
//
// 这样还有一个附带好处：运行时 jar 里 dev.craftgraph.* 是**一个**包，
// 不会出现跨 jar 拆分包；sources jar 也是自动带上的，不用额外配置。
//
// 那 core/ 为什么还留着一个独立工程？为了**用编译器守住「它不含 MC」这件事**：
// 在 mod 工程里 MC 就在类路径上，`import net.minecraft.*` 会编译过、测试也过，
// 那份独立的构建会让它立刻编译失败。见 core/build.gradle 顶部。
sourceSets.main.java.srcDir '../core/src/main/java'

// 把 core 这个子工程的产物收进本构建自己的 build/ 下。
//
// 默认它会写 core/build/，而 1.20.1 那个构建 include 的是同一个 projectDir，
// 于是两个构建共用同一个输出目录 —— 而它们的编译目标不同（这边 release 21、那边 17），
// 谁最后跑谁赢，并发跑更会互相覆盖。见 ../mod-1.20.1/build.gradle 里同一段。
project(':core').layout.buildDirectory.set(layout.buildDirectory.dir('core'))

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// ---------------------------------------------------------------- 测试
//
// 绝大部分桥接逻辑刻意做成不依赖 Minecraft 的纯 Java（现在住在 core/），
// 这样倒排索引、查询、HTTP 服务都能用普通 JUnit 测，不需要启动游戏。
// 留在本工程的测试只有两个：它们守的是这个工程自己的资源与源码
//（访问转换器文件、日志文案），所以跟着版本走。core 的测试在 `:core:test`。

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ModDevGradle 把 Minecraft 那套依赖（含 Gson）只加到主源码集的类路径上，
    // 测试默认看不到，所以要显式声明。
    //
    // 版本必须和游戏实际用的一致（1.21.1 是 2.10.1，由 Minecraft 的 strictly 约束锁定）。
    // 用别的版本会掩盖真实问题 —— JsonTest 的意义正是验证「游戏自带的那版 Gson
    // 支持 record 和 serializeNulls」，换一个版本去测等于没测。
    // 升级 Minecraft 时用 gradlew dependencies --configuration compileClasspath 核对。
    testImplementation 'com.google.code.gson:gson:2.10.1'

    // ---- 软依赖模组（只编译期）----
    //
    // compileOnly：产物里没有它，运行时不要求它存在。
    // 这一条依赖的作用**只是让编译器核对我们的调用与 Create 真实 API 一致** ——
    // 方法名、参数、返回类型全都会被检查。没有它就只能靠反射，那样连拼写错误都发现不了。
    //
    // 版本对齐 1.21.1 上当前发布的最新版。注意它的版本号带构建号（6.0.11-300 而不是 6.0.11），
    // 少写那个后缀会解析不到。换版本时注意：ProcessingRecipe 的几个访问器在 6.x 内是稳定的，
    // 但我们只编译验证过这一版。
    //
    // transitive = false：我们只需要 Create 自己的类来做类型检查，
    // 不碰它的实现依赖（Registrate 等还分散在别的仓库）。
    // 打开传递依赖会把一堆与本次编译无关的仓库都拖进来，而它们对「方法签名对不对」毫无帮助。
    compileOnly('com.simibubi.create:create-1.21.1:6.0.11-300') {
        transitive = false
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
        showStandardStreams = false
    }

    // 把契约样本目录声明成 test 的产物。
    //
    // 不声明的话，ContractDumpTest 写文件就是一次**未声明的副作用**，Gradle 对它是瞎的。
    // 实测（删掉目录后 ./gradlew build）：`:test UP-TO-DATE`，9 秒 BUILD SUCCESSFUL，
    // 目录**没有**被重建。CI 上是同一件事的更狠版本 —— 只改了 TypeScript 的提交
    // 不会让 `:test` 的输入变化，于是它 FROM-CACHE，样本从未生成，而这一步的
    // 表现是「构建成功、上传契约样本失败」，看起来像上传的问题，其实根因在这里。
    //
    // 声明之后就正常了：产物缺失会让 test 重新执行（或从构建缓存里连同产物一起恢复），
    // 「样本在不在」从此是任务状态的一部分，而不是运气。
    outputs.dir(layout.projectDirectory.dir('../shared/fixtures/bridge-dump'))
}


// ---------------------------------------------------------------- 发布

// 发布到 KessokuMaven。
//
// 凭据**只从环境变量读，绝不写进仓库**。这里的判断放在任务的 doFirst 里而不是
// 配置阶段 —— 否则没设环境变量时连 `gradlew build` 都跑不起来，
// 而日常构建根本不需要发布凭据。
tasks.withType(PublishToMavenRepository).configureEach {
    doFirst {
        def missing = []
        if (!System.getenv('K_MAVEN_USERNAME')) missing << 'K_MAVEN_USERNAME'
        if (!System.getenv('K_MAVEN_TOKEN')) missing << 'K_MAVEN_TOKEN'
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "发布到 KessokuMaven 需要环境变量：" + missing.join('、') + "\n" +
                    "  PowerShell:  \$env:K_MAVEN_USERNAME='...'; \$env:K_MAVEN_TOKEN='...'\n" +
                    "  cmd.exe:     set K_MAVEN_USERNAME=... && set K_MAVEN_TOKEN=...\n" +
                    "  Git Bash:    export K_MAVEN_USERNAME=... K_MAVEN_TOKEN=...")
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // 1.20.2 之后的 NeoForge 用 Mojang 官方映射，不需要 reobf，
            // 所以直接的 java 组件就是可用的产物。
            from components.java

            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
                developers {
                    developer {
                        // build.gradle 是 UTF-8 读的（不同于 gradle.properties 的 ISO-8859-1），
                        // 所以这里可以用中文。
                        name = 'Luzzi（辛六子）'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            name = 'KessokuMaven'
            url = 'https://maven.kessokuteatime.work/releases'
            credentials {
                // 空串兜底而不是 null：传 null 会让 Gradle 在任务配置校验阶段就失败，
                // 报 "credentials.username doesn't have a configured value" ——
                // 那个报错不会告诉你要设哪两个环境变量。给空串让校验通过，
                // 由上面的 doFirst 守卫给出真正可操作的提示。
                username = System.getenv('K_MAVEN_USERNAME') ?: ''
                password = System.getenv('K_MAVEN_TOKEN') ?: ''
            }
        }
    }
}

