# Gradle 自身
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# MDK 默认开启配置缓存；这里先关掉，出问题时更容易看懂报错。熟悉之后再打开。
org.gradle.configuration-cache=false

# 映射（官方 MDK 用的 Parchment 版本）
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.251
loader_version_range=[1,)

# Mod 元信息
mod_id=craftgraph
mod_name=CraftGraph
mod_license=MIT
mod_version=0.1.0
mod_group_id=dev.craftgraph
mod_authors=hualo
# 只能写 ASCII —— Gradle 按 ISO-8859-1 读这个文件（既定行为），中文会变乱码。
#
# 游戏内显示的 Mod 描述写在 src/main/templates/META-INF/neoforge.mods.toml 里（UTF-8），
# 这里的英文版是给发布的 POM 用的，面向的是 Maven 消费者而不是玩家。
mod_description=Exposes the running Minecraft recipe data over a local HTTP API for AI clients.
