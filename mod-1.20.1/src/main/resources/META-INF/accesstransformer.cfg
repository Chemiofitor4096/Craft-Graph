# 访问转换器（Access Transformer）—— Minecraft 1.20.1 / MinecraftForge
#
# 让指定的包私有成员变成公开。Forge 在加载时对本 mod 生效，
# 与我们是否安装 JEI/EMI 无关。
#
# ⚠️ **成员名必须写 SRG 名**（Forge 1.20.1 官方文档：
# "When using Access Transformers on Minecraft classes, the SRG name must be used
#  for fields and methods"）。类名仍然写官方名。
#
# 这跟 1.21.1 那份（../mod/src/main/resources/META-INF/accesstransformer.cfg）
# 是同一件事、不同的写法：那边用官方名，这边用 SRG 名。
# 弄错的症状不是编译失败，而是**那 27 条锻造配方又变回 opaque** ——
# 看起来跟「本来就这样」一模一样，所以 live 层那两条锻造探针必须留着。
#
# SRG 名不是猜的：把 Mojang 的 1.20.1 官方映射与 Forge 的 mcp_config（joined.tsrg）
# 串起来查出来的。SmithingTransformRecipe 那三条与 JEI 在 1.20.1 上的
# accesstransformer.cfg 逐字一致（这一步同时验证了查法本身是对的）。

# ---- 下界合金升级（SmithingTransformRecipe）----
public net.minecraft.world.item.crafting.SmithingTransformRecipe f_265949_ # template
public net.minecraft.world.item.crafting.SmithingTransformRecipe f_265888_ # base
public net.minecraft.world.item.crafting.SmithingTransformRecipe f_265907_ # addition

# ---- 盔甲纹饰（SmithingTrimRecipe）----
# 这三条 JEI 没写（它那个 AT 只覆盖 Transform），是我们自己查出来的。
public net.minecraft.world.item.crafting.SmithingTrimRecipe f_265958_ # template
public net.minecraft.world.item.crafting.SmithingTrimRecipe f_266040_ # base
public net.minecraft.world.item.crafting.SmithingTrimRecipe f_266053_ # addition

# 注意这里**没有** Create 的条目，尽管一度加过 —— 记录一下那个来回，免得下次再走一遍：
#
# 我先以为 1.20.1 的 SequencedAssemblyRecipe 读不到（没有 getSequence()/getIngredient()），
# 于是写了 AT 到 Create 的类上。结果是构建期直接失败：
#   access-transformer:missing-target: The target ...SequencedAssemblyRecipe FIELD ingredient
#   does not exist
# 原因有两层：一是这个校验只看 Minecraft 的类，模组类不在它的视野里；
# 二是**那个前提本身就是错的** —— 我那次 grep 用了 head -30，把结论截断了。
# 完整看一遍：getIngredient() 在第 278 行、getSequence() 在第 282 行，都是 public。
#
# 所以这一项与 1.21.1 一样走访问器，不需要任何特权。
