# CraftGraph 桥接 Mod（Minecraft 1.20.1 / MinecraftForge）
#
# ⚠️ 这个文件是 Gradle 按 **ISO-8859-1** 读的，只能写 ASCII。
# 中文（Mod 描述、作者署名）写在 src/main/templates/META-INF/mods.toml（UTF-8）。
#
# 注意这里**没有 mod_version** —— 它从 ../mod/gradle.properties 读（见 build.gradle），
# 两个 jar 是同一个产品的两个版本变体，各自维护一个版本号只会让人对着两个数字猜。

# Gradle 自身（与 mod/ 保持一致）
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# MDK 默认开启配置缓存；这里先关掉，出问题时更容易看懂报错。
org.gradle.configuration-cache=false

# Minecraft / MinecraftForge
#
# 47.2.0 是「兼容 47.2.0 以上」里那个下界，**故意不取最新的 47.4.x**：
# 在最低版本上编译，用到更新的 API 会直接编不过 —— 版本漂移风险从「靠自觉」
# 变成「编译器拦住」。见 doc/porting-1.20.1.md。
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.2.0
loader_version_range=[47.2.0,)

# 软依赖模组的编译期版本（compileOnly，产物里没有它）
#
# Create 在 1.20.1 这条线上也有 6.0.x（maven 上的工件名是 create-1.20.1，
# 版本号带构建号，少写后缀会解析不到），API 形状与 1.21.1 上我们编译验证过的同一套。
create_version=6.0.8-291

# Mod 元信息
mod_id=craftgraph
mod_name=CraftGraph
mod_license=MIT
mod_group_id=dev.craftgraph
mod_authors=Luzzi
mod_description=Exposes the running Minecraft recipe data over a local HTTP API for AI clients.
