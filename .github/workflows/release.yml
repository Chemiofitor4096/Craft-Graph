name: Release

# 打 tag 即发布：构建两个 MC 版本的 jar（1.21.1 / 1.20.1）附到 GitHub Release 上。
#
# 为什么单独一个 workflow 而不是塞进 ci.yml：
# ci.yml 跑在 push 到 main / PR 上，是「每次改代码都验证」；
# 这个是「决定对外发布时」才跑，权限要求也不同（需要 contents: write）。
#
# 两个版本各一个 job：它们需要**不同的 JDK**（1.21.1 是 21，1.20.1 的 Forge 是 17），
# 而且是两个独立的 Gradle 构建。发布那个 job 把两边的产物凑齐再建 Release ——
# 这样「只发了一半」是不可能的（needs 会让缺任何一半时整个 workflow 失败）。

on:
  push:
    tags: ['v*']
  # 手动触发 = 干跑：只构建、校验、上传成 workflow artifact，不建 Release。
  # 发布流程本身值得先干跑一次 —— 等打完 tag 才发现只有 tag 触发的那条路径有问题，
  # 就得多打一个 tag 才能修。
  workflow_dispatch:
    inputs:
      tag:
        description: '要校验的版本 tag（形如 v0.2.2），用于干跑时比对产物版本'
        required: true

permissions:
  # 默认的 GITHUB_TOKEN 对 contents 是只读，建 Release 需要显式提权。
  contents: write

jobs:
  # ------------------------------------------------------------ 1.21.1 / NeoForge
  mod-neoforge:
    name: 构建 1.21.1 jar
    runs-on: ubuntu-latest
    # 与 ci.yml 同理：冷缓存下要下载并反编译 Minecraft，给个上限避免挂到 6 小时。
    timeout-minutes: 40
    env:
      # tag 推送用 ref 本身；手动触发用输入的那个（仅用于校验，不发布）
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 检查 gradlew 可执行位
        run: |
          if [ ! -x mod/gradlew ]; then
            echo "::error::mod/gradlew 在 git 里不是可执行文件（应为 100755）。"
            echo "::error::修复：git update-index --chmod=+x mod/gradlew 然后提交，提交前不要 reset。"
            exit 1
          fi

      # build 依赖 check → test，所以发出去的 jar 一定是测试通过的。
      - name: 构建与测试
        working-directory: mod
        run: ./gradlew build --no-daemon --stacktrace

      # 这一步是这个 workflow 里最值钱的一道检查。
      #
      # tag 是 v0.1.1 而 gradle.properties 里还是 0.1.0，是很常见的手滑 ——
      # 后果是 Release 页面写着 0.1.1，附件却是一个自我标识为 0.1.0 的 jar，
      # 玩家装上去以后游戏里显示的版本对不上，排查起来要绕一大圈。
      # 与其发布之后再发现，不如在这里直接失败。
      #
      # 两个 jar 共用同一个 mod_version（mod-1.20.1 那边是从这个文件读的），
      # 所以这一处检查对两个版本同时成立。
      - name: 校验 tag 与 mod_version 一致
        working-directory: mod
        run: |
          set -euo pipefail
          TAG_VER="${RELEASE_TAG#v}"
          FILE_VER=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')

          if [ "$FILE_VER" != "$TAG_VER" ]; then
            echo "::error::tag 是 ${RELEASE_TAG}，但 gradle.properties 里 mod_version=${FILE_VER}"
            echo "::error::先把 mod_version 改成 ${TAG_VER} 并提交，再打 tag。"
            echo "::error::否则 Release 标称的版本和 jar 自我标识的版本会不一致。"
            exit 1
          fi

          JAR="build/libs/craftgraph-${FILE_VER}.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::没找到 $JAR —— 构建产物名字与 mod_version 不符？"
            ls -la build/libs/
            exit 1
          fi

          # jar 内部的 metadata 也要对得上：文件名对而 mods.toml 没跟着变，
          # 是上面那条检查盖不住的另一种手滑。
          if ! unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q "version = \"${FILE_VER}\""; then
            echo "::error::$JAR 里的 neoforge.mods.toml 版本不是 ${FILE_VER}"
            unzip -p "$JAR" META-INF/neoforge.mods.toml
            exit 1
          fi

          echo "版本校验通过：${RELEASE_TAG} / mod_version=${FILE_VER} / jar 内 metadata 一致"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: craftgraph-neoforge-jars
          path: mod/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------- 1.20.1 / MinecraftForge
  #
  # ⚠️ job id 里**不能有点**（GitHub 的约束是 [A-Za-z_][A-Za-z0-9_-]*）。
  # 写成 mod-1.20.1 会让整个 workflow 文件失效，而症状很难往这边想：
  # run 立刻失败、一个 job 都没有、workflow 名字变成文件路径，
  # 本地拿任何 YAML 解析器看却都是好的。所以 job id 用 mod-forge / mod-neoforge，
  # 版本号放在显示名（name:）里 —— 那个不受限。
  mod-forge:
    name: 构建 1.20.1 jar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 1.20.1 的 Forge 跑在 Java 17 上，工具链与编译目标都是 17。
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 检查 gradlew 可执行位
        run: |
          if [ ! -x mod-1.20.1/gradlew ]; then
            echo "::error::mod-1.20.1/gradlew 在 git 里不是可执行文件（应为 100755）。"
            echo "::error::修复：git update-index --chmod=+x mod-1.20.1/gradlew 然后提交，提交前不要 reset。"
            exit 1
          fi

      - name: 构建与测试
        working-directory: mod-1.20.1
        run: ./gradlew build --no-daemon --stacktrace

      # 与 1.21.1 那边同理，只是文件名带 classifier、metadata 在 mods.toml（不是 neoforge.mods.toml）。
      #
      # 另外这里校验**访问转换器确实在 jar 里**：它对锻造那 27 条配方的作用是静默的
      # （写错/丢失不是崩溃，而是那批配方变回 opaque），所以在产物上就地断言一句，
      # 比等玩家在游戏里发现便宜得多。
      - name: 校验产物（版本、mods.toml、访问转换器）
        working-directory: mod-1.20.1
        run: |
          set -euo pipefail
          TAG_VER="${RELEASE_TAG#v}"
          FILE_VER=$(grep -E '^mod_version=' ../mod/gradle.properties | cut -d= -f2 | tr -d '[:space:]')

          if [ "$FILE_VER" != "$TAG_VER" ]; then
            echo "::error::tag 是 ${RELEASE_TAG}，但 mod_version=${FILE_VER}（两个版本共用它）"
            exit 1
          fi

          JAR="build/libs/craftgraph-${FILE_VER}-mc1.20.1.jar"
          if [ ! -f "$JAR" ]; then
            echo "::error::没找到 $JAR —— 产物名字与 mod_version 不符？"
            ls -la build/libs/ build/devlibs/ 2>/dev/null || true
            exit 1
          fi

          if ! unzip -p "$JAR" META-INF/mods.toml | grep -q "version = \"${FILE_VER}\""; then
            echo "::error::$JAR 里的 mods.toml 版本不是 ${FILE_VER}"
            unzip -p "$JAR" META-INF/mods.toml
            exit 1
          fi

          if ! unzip -l "$JAR" | grep -q "META-INF/accesstransformer.cfg"; then
            echo "::error::$JAR 里没有 META-INF/accesstransformer.cfg —— 锻造配方会静默退化成读不懂"
            exit 1
          fi

          echo "版本校验通过：${RELEASE_TAG} / mod_version=${FILE_VER} / mods.toml 与 AT 都在"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: craftgraph-forge-jars
          path: mod-1.20.1/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------ 建 Release
  release:
    name: 建 Release
    needs: [mod-neoforge, mod-forge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 取回两个版本的产物
        uses: actions/download-artifact@v4
        with:
          pattern: craftgraph-*-jars
          merge-multiple: true
          path: dist

      - name: 确认四个附件都在
        run: ls -la dist/

      # 只有真正的 tag 推送才建 Release。手动触发到这一步为止。
      - name: 发布 GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          # 两个 MC 版本各一对（jar + sources jar），四个一起挂上去 ——
          # 「同一个版本的两个变体」这件事在 Release 页面上必须一眼看得见。
          #
          # --generate-notes 会按 commit 自动归类，比手写更容易保持准确。
          gh release create "$TAG" \
            --title "CraftGraph ${VER}" \
            --generate-notes \
            dist/craftgraph-${VER}.jar \
            dist/craftgraph-${VER}-sources.jar \
            dist/craftgraph-${VER}-mc1.20.1.jar \
            dist/craftgraph-${VER}-mc1.20.1-sources.jar

      - name: 干跑结束提示
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "干跑完成：两个版本的构建与校验都通过，产物在 workflow artifacts 里。"
          echo "确认无误后打 tag 推送即可真正发布："
          echo "  git tag v$(grep -E '^mod_version=' mod/gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "  git push origin --tags"
