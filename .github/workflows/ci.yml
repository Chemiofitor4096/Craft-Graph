name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行在新推送到来时取消，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ Mod
  #
  # 这个 Mod 的 83 个测试**不需要启动 Minecraft**（配方索引、归一化、HTTP 服务
  # 都做成了纯 Java），所以 CI 里跑得动。
  #
  # 但 `./gradlew test` 仍然需要完整的 NeoForge 类路径：首次运行要下载并反编译
  # Minecraft，在冷缓存下会慢好几分钟。setup-gradle 负责缓存，之后的运行快得多。
  mod:
    name: Bridge Mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 构建与测试
        working-directory: mod
        run: ./gradlew build test --no-daemon --stacktrace

      # 契约样本由 ContractDumpTest 生成，交给下面的 contract job 使用。
      # 它刻意不提交进仓库（生成物），所以必须在这里显式传递。
      - name: 上传跨语言契约样本
        uses: actions/upload-artifact@v4
        with:
          name: bridge-dump
          path: shared/fixtures/bridge-dump/
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------ MCP Server
  #
  # 这一组不依赖 Java 构建，所以和上面的 mod job 并行跑，反馈更快。
  mcp:
    name: MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: 安装依赖
        working-directory: mcp-server
        run: npm ci

      - name: 类型检查
        working-directory: mcp-server
        run: npm run typecheck

      - name: 算法测试
        working-directory: mcp-server
        run: npm run smoke

      - name: MCP 协议测试
        working-directory: mcp-server
        run: npm run e2e

  # -------------------------------------------------------------- 契约
  #
  # 这一 job 存在的理由：两侧是分别对着假数据开发的，契约本身必须被真正跑通一次。
  # Java 侧导出真实响应体，TypeScript 侧整套链路吃这些字节。
  contract:
    name: 跨语言契约
    runs-on: ubuntu-latest
    needs: mod
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: 安装依赖
        working-directory: mcp-server
        run: npm ci

      - name: 下载契约样本
        uses: actions/download-artifact@v4
        with:
          name: bridge-dump
          path: shared/fixtures/bridge-dump/

      - name: 校验契约
        working-directory: mcp-server
        run: npm run contract

# 有意不在 CI 里跑的脚本：
#
#   npm run live    —— 需要运行中的 Minecraft 实例
#   npm run inspect —— 同上
#   npm run measure / compare / analyze —— 只输出测量结果、不做断言，
#                                          放进 CI 无法失败，等有了 token 预算阈值再说
