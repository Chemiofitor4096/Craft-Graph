name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行在新推送到来时取消，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ Mod
  #
  # 这个 Mod 的 104 个测试**不需要启动 Minecraft**（配方索引、归一化、HTTP 服务
  # 都做成了纯 Java），所以 CI 里跑得动。
  #
  # 但 `./gradlew test` 仍然需要完整的 NeoForge 类路径：首次运行要下载并反编译
  # Minecraft，在冷缓存下会慢好几分钟。setup-gradle 负责缓存，之后的运行快得多。
  #
  # 有两件事 CI 测不到，只能靠 `npm run live` 在真游戏上验证：抽取层里
  # `instanceof AbstractCookingRecipe` 的派发（测试类路径看不到 Minecraft），
  # 以及真数据里 duration / machine 到底有没有值。见 mod/README.md 的说明。
  mod:
    name: Bridge Mod
    runs-on: ubuntu-latest
    # 首次运行要下载 NeoForge 并反编译 Minecraft，冷缓存下会慢；
    # 给一个上限，避免网络卡住时一直挂到 GitHub 默认的 6 小时。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 这道检查是有来历的：gradlew 曾经以 100644（不可执行）提交进仓库，
      # CI 报的是 "./gradlew: Permission denied" —— 和代码毫无关系，很难往这边想。
      #
      # 根因是 Windows 上 core.filemode=false：git 完全忽略工作区的权限位，
      # 所以 git add 永远不会把 gradlew 变成可执行，必须用 update-index 直接改索引。
      #
      # 与其在 CI 里 chmod +x 掩盖过去（那样 Linux/macOS 用户克隆后仍然会踩），
      # 不如在这里明确失败并给出修复命令。
      - name: 检查 gradlew 可执行位
        run: |
          if [ ! -x mod/gradlew ]; then
            echo "::error::mod/gradlew 在 git 里不是可执行文件（应为 100755）。"
            echo "::error::Linux/macOS 上克隆后 ./gradlew 会 Permission denied。"
            echo "::error::修复：git update-index --chmod=+x mod/gradlew 然后提交。"
            echo "::error::注意：Windows 上 core.filemode=false，git add 检测不到权限变化，提交前也不要 reset。"
            exit 1
          fi

      # 这里只跑 build：它依赖 check，check 依赖 test，所以测试包含在内。
      # 这个 Mod 的测试不需要启动 Minecraft，CI 里跑得动。
      - name: 构建与测试
        working-directory: mod
        run: ./gradlew build --no-daemon --stacktrace

      # 契约样本由 ContractDumpTest 生成，交给下面的 contract job 使用。
      # 它刻意不提交进仓库（生成物），所以必须在这里显式传递。
      - name: 上传跨语言契约样本
        uses: actions/upload-artifact@v4
        with:
          name: bridge-dump
          path: shared/fixtures/bridge-dump/
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------ MCP Server
  #
  # 这一组不依赖 Java 构建，所以和上面的 mod job 并行跑，反馈更快。
  mcp:
    name: MCP Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: 安装依赖
        working-directory: mcp-server
        run: npm ci

      - name: 类型检查
        working-directory: mcp-server
        run: npm run typecheck

      - name: 算法测试
        working-directory: mcp-server
        run: npm run smoke

      - name: MCP 协议测试
        working-directory: mcp-server
        run: npm run e2e

  # -------------------------------------------------------------- 契约
  #
  # 这一 job 存在的理由：两侧是分别对着假数据开发的，契约本身必须被真正跑通一次。
  # Java 侧导出真实响应体，TypeScript 侧整套链路吃这些字节。
  contract:
    name: 跨语言契约
    runs-on: ubuntu-latest
    needs: mod
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: 安装依赖
        working-directory: mcp-server
        run: npm ci

      - name: 下载契约样本
        uses: actions/download-artifact@v4
        with:
          name: bridge-dump
          path: shared/fixtures/bridge-dump/

      - name: 校验契约
        working-directory: mcp-server
        run: npm run contract

# 有意不在 CI 里跑的脚本：
#
#   npm run live    —— 需要运行中的 Minecraft 实例
#   npm run inspect —— 同上
#   npm run measure / compare / analyze —— 只输出测量结果、不做断言，
#                                          放进 CI 无法失败，等有了 token 预算阈值再说
