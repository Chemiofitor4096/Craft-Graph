name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行在新推送到来时取消，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ Mod
  #
  # 这个 Mod 的 104 个测试**不需要启动 Minecraft**（配方索引、归一化、HTTP 服务
  # 都做成了纯 Java），所以 CI 里跑得动。
  #
  # 但 `./gradlew test` 仍然需要完整的 NeoForge 类路径：首次运行要下载并反编译
  # Minecraft，在冷缓存下会慢好几分钟。setup-gradle 负责缓存，之后的运行快得多。
  #
  # 有两件事 CI 测不到，只能靠 `npm run live` 在真游戏上验证：抽取层里
  # `instanceof AbstractCookingRecipe` 的派发（测试类路径看不到 Minecraft），
  # 以及真数据里 duration / machine 到底有没有值。见 mod/README.md 的说明。
  mod:
    name: Bridge Mod
    runs-on: ubuntu-latest
    # 首次运行要下载 NeoForge 并反编译 Minecraft，冷缓存下会慢；
    # 给一个上限，避免网络卡住时一直挂到 GitHub 默认的 6 小时。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 这道检查是有来历的：gradlew 曾经以 100644（不可执行）提交进仓库，
      # CI 报的是 "./gradlew: Permission denied" —— 和代码毫无关系，很难往这边想。
      #
      # 根因是 Windows 上 core.filemode=false：git 完全忽略工作区的权限位，
      # 所以 git add 永远不会把 gradlew 变成可执行，必须用 update-index 直接改索引。
      #
      # 与其在 CI 里 chmod +x 掩盖过去（那样 Linux/macOS 用户克隆后仍然会踩），
      # 不如在这里明确失败并给出修复命令。
      - name: 检查 gradlew 可执行位
        run: |
          # 两个工程各有自己的 wrapper（1.21.1 与 1.20.1 是两个独立的 Gradle 构建）。
          FAILED=0
          for W in mod/gradlew mod-1.20.1/gradlew; do
            if [ ! -x "$W" ]; then
              echo "::error::$W 在 git 里不是可执行文件（应为 100755）。"
              echo "::error::Linux/macOS 上克隆后 ./gradlew 会 Permission denied。"
              echo "::error::修复：git update-index --chmod=+x $W 然后提交。"
              echo "::error::注意：Windows 上 core.filemode=false，git add 检测不到权限变化，提交前也不要 reset。"
              FAILED=1
            fi
          done
          exit $FAILED

      # 这里只跑 build：它依赖 check，check 依赖 test，所以测试包含在内。
      # 这个 Mod 的测试不需要启动 Minecraft，CI 里跑得动。
      - name: 构建与测试
        working-directory: mod
        run: ./gradlew build --no-daemon --stacktrace

      # 反向的那一半：1.21.1 用 neoforge.mods.toml，依赖块写 type="required"。
      # 把 1.20.1 那套 mandatory 抄过来同样会让游戏拒收（NeoForge 认的是 type）。
      # 两边都数一遍，是因为这两个文件长得很像、很容易互相抄错。
      - name: 校验产物元数据形状（neoforge.mods.toml / type）
        working-directory: mod
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/craftgraph-*.jar | grep -v sources | head -1)
          TOML=$(mktemp)
          unzip -p "$JAR" META-INF/neoforge.mods.toml > "$TOML"

          BLOCKS=$(grep -c '^\[\[dependencies\.' "$TOML" || true)
          REQUIRED=$(grep -cE '^[[:space:]]*type[[:space:]]*=[[:space:]]*"required"' "$TOML" || true)
          if [ "$BLOCKS" -eq 0 ] || [ "$BLOCKS" != "$REQUIRED" ]; then
            echo "::error::$JAR 里依赖块 $BLOCKS 个，而 type=\"required\" 只有 $REQUIRED 处"
            echo "::error::NeoForge 1.21.1 每个依赖块都要 type=\"required\"（不是 mandatory=true）。"
            cat "$TOML"
            exit 1
          fi
          echo "依赖块形状正确：$BLOCKS 个块，$REQUIRED 处 type=required"

      # 契约样本由 ContractDumpTest 生成，而目录本身刻意不提交进仓库（见 .gitignore），
      # 所以 fresh clone 里它不存在，必须由测试真的写出来 —— 这一步不能省。
      #
      # 为什么不能指望上面的 build 顺带生成（这条踩过，两次 CI 红都出在这里）：
      # 只改了 TypeScript 的提交不会让 `:test` 的输入变化，setup-gradle 配的构建缓存
      # 会让它直接 FROM-CACHE，测试不执行，样本目录从头到尾没被创建，
      # 于是红的是下面那步 upload（no files found）—— 看起来像上传的问题，根因却在缓存。
      #
      # 在 mod/build.gradle 里把目录声明成 test 的产物，只能修好本地 up-to-date 判断；
      # 缓存命中时会不会连带恢复产物属于 Gradle 内部细节，不该拿来赌。
      #
      # 所以这里无条件真跑一次，并且关掉缓存读写 —— 缓存一旦参与，
      # "这一步到底跑没跑"就又要靠推理，而它的产物是给下一个 job 用的，必须确定。
      # 跑全套而不是 --tests 过滤：过滤跑会把 test-results 覆盖成只剩一个类。
      - name: 生成跨语言契约样本
        working-directory: mod
        run: ./gradlew test --rerun --no-build-cache --no-daemon

      # 交给下面的 contract job 使用。
      - name: 上传跨语言契约样本
        uses: actions/upload-artifact@v4
        with:
          name: bridge-dump
          path: shared/fixtures/bridge-dump/
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------- Mod（Minecraft 1.20.1）
  #
  # 与上面的 mod job 是**两个版本变体**：共享 core/ 那批算法，只有「读游戏对象」
  # 的部分不同。这里是独立的 Gradle 构建，所以要单独跑一遍 —— 不跑的话这条线会悄悄烂掉。
  #
  # 三件与 1.21.1 不同、必须写清的事：
  #
  #   1. **JDK 17**，不是 21。1.20.1 的 Forge 跑在 17 上，工具链与编译目标都是 17。
  #   2. 首次运行要下载 MCP 映射与 Forge 并反编译 Minecraft，冷缓存下明显更慢（超时给够）。
  #   3. 产物是 **reobfuscate 过的**（Forge 1.20.1 运行时用 SRG 名）：未混淆的那个在
  #      build/devlibs，build/libs 里那个才是发布用的 —— 由 ModDevGradle 自动安排。
  # ⚠️ job id 里**不能有点**。GitHub 对 job id 的约束是
  # [A-Za-z_][A-Za-z0-9_-]*，写成 mod-1.20.1 会让**整个 workflow 文件失效** ——
  # 症状是「run 立刻失败、一个 job 都没有、workflow 名字变成文件路径」，
  # 而本地用任何 YAML 解析器看都是好的。所以这里用 mod-forge（显示名不受限，仍是 1.20.1）。
  mod-forge:
    name: Bridge Mod 1.20.1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # build 依赖 check → test，所以 :core:test（那 148 个纯逻辑用例）与
      # 本工程自己的两个测试都包含在内。契约样本由 1.21.1 那个 job 负责生成，
      # 两边跑的是同一份源码、写出同样的字节，不必重复上传。
      - name: 构建与测试
        working-directory: mod-1.20.1
        run: ./gradlew build --no-daemon --stacktrace

      # 依赖块的字段名是**只有游戏才会验**的那类差异，所以要在这里数一遍：
      # Forge 1.20.1 每个 [[dependencies.*]] 都要 mandatory=true；写成 NeoForge 那套
      # type="required" 时，编译、测试、构建全过，而游戏在扫描 mod 文件阶段直接拒收
      #   InvalidModFileException: Missing required field mandatory in dependency
      # 表现成「装了但这个 mod 不存在」—— 实测踩过一次。
      - name: 校验产物元数据形状（mandatory / neoforge.mods.toml）
        working-directory: mod-1.20.1
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/craftgraph-*-mc1.20.1.jar | head -1)
          TOML=$(mktemp)
          unzip -p "$JAR" META-INF/mods.toml > "$TOML"

          BLOCKS=$(grep -c '^\[\[dependencies\.' "$TOML" || true)
          MANDATORY=$(grep -cE '^[[:space:]]*mandatory[[:space:]]*=[[:space:]]*true' "$TOML" || true)
          if [ "$BLOCKS" -eq 0 ] || [ "$BLOCKS" != "$MANDATORY" ]; then
            echo "::error::$JAR 里依赖块 $BLOCKS 个，而 mandatory=true 只有 $MANDATORY 处"
            echo "::error::Forge 1.20.1 每个依赖块都要 mandatory=true（不是 type=\"required\"）。"
            cat "$TOML"
            exit 1
          fi
          if grep -qE '^[[:space:]]*type[[:space:]]*=' "$TOML"; then
            echo "::error::$JAR 的 mods.toml 里出现了 type= —— 那是 NeoForge 的写法，Forge 会拒收"
            exit 1
          fi
          echo "依赖块形状正确：$BLOCKS 个块，$MANDATORY 处 mandatory"

      # 产物自检：Forge 1.20.1 要的是 META-INF/mods.toml（不是 neoforge.mods.toml），
      # 而访问转换器必须真的在 jar 里 —— 它写错时是**静默**的（锻造变回 opaque），
      # 所以在 CI 里就地断言一下比等游戏里发现便宜。
      - name: 校验产物（mods.toml 与访问转换器）
        working-directory: mod-1.20.1
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/craftgraph-*-mc1.20.1.jar | head -1)
          echo "检查 $JAR"
          unzip -p "$JAR" META-INF/mods.toml | grep -q 'modLoader = "javafml"'
          unzip -p "$JAR" META-INF/mods.toml | grep -q "modId = \"craftgraph\""
          unzip -l "$JAR" | grep -q "META-INF/accesstransformer.cfg"
          echo "产物自检通过"

  # ------------------------------------------------------------ MCP Server
  #
  # 这一组不依赖 Java 构建，所以和上面的 mod job 并行跑，反馈更快。
  mcp:
    name: MCP Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: 安装依赖
        working-directory: mcp-server
        run: npm ci

      - name: 类型检查
        working-directory: mcp-server
        run: npm run typecheck

      - name: 算法测试
        working-directory: mcp-server
        run: npm run smoke

      - name: MCP 协议测试
        working-directory: mcp-server
        run: npm run e2e

  # -------------------------------------------------------------- 契约
  #
  # 这一 job 存在的理由：两侧是分别对着假数据开发的，契约本身必须被真正跑通一次。
  # Java 侧导出真实响应体，TypeScript 侧整套链路吃这些字节。
  contract:
    name: 跨语言契约
    runs-on: ubuntu-latest
    needs: mod
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: 安装依赖
        working-directory: mcp-server
        run: npm ci

      - name: 下载契约样本
        uses: actions/download-artifact@v4
        with:
          name: bridge-dump
          path: shared/fixtures/bridge-dump/

      - name: 校验契约
        working-directory: mcp-server
        run: npm run contract

# 有意不在 CI 里跑的脚本：
#
#   npm run live    —— 需要运行中的 Minecraft 实例
#   npm run inspect —— 同上
#   npm run measure / compare / analyze —— 只输出测量结果、不做断言，
#                                          放进 CI 无法失败，等有了 token 预算阈值再说
